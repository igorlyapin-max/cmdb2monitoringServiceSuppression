name: cmdb2monitoring-service-suppression

x-dotnet-env: &dotnet-env
  Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
  Kafka__SecurityProtocol: ${KAFKA_SECURITY_PROTOCOL:-Plaintext}
  Kafka__SaslMechanism: ${KAFKA_SASL_MECHANISM:-Plain}
  Kafka__Username: ${KAFKA_USERNAME:-}
  Kafka__Password: ${KAFKA_PASSWORD:-}
  Debug__Enabled: ${DEBUG_ENABLED:-false}
  Debug__Level: ${DEBUG_LEVEL:-Basic}
  Readiness__CheckExternalDependencies: ${READINESS_CHECK_EXTERNAL_DEPENDENCIES:-false}
  Readiness__CheckTimeoutMs: ${READINESS_CHECK_TIMEOUT_MS:-2000}
  KafkaLogging__Enabled: ${KAFKA_LOGGING_ENABLED:-false}
  KafkaLogging__Topic: ${KAFKA_LOGGING_TOPIC:-service-suppression.logs}
  KafkaLogging__MinimumLevel: ${KAFKA_LOGGING_MINIMUM_LEVEL:-Information}
  KafkaLogging__Environment: ${LOGGING_ENVIRONMENT:-Production}
  ElkLogging__Enabled: ${ELK_LOGGING_ENABLED:-false}
  ElkLogging__Endpoint: ${ELK_LOGGING_ENDPOINT:-}
  ElkLogging__ApiKey: ${ELK_LOGGING_API_KEY:-}
  ElkLogging__MinimumLevel: ${ELK_LOGGING_MINIMUM_LEVEL:-Information}
  ElkLogging__Environment: ${LOGGING_ENVIRONMENT:-Production}
  Redis__Enabled: ${REDIS_ENABLED:-false}
  Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-}
  ConfigurationReload__Enabled: ${CONFIGURATION_RELOAD_ENABLED:-false}
  ConfigurationReload__BearerToken: ${CONFIGURATION_RELOAD_BEARER_TOKEN:-}
  ConfigurationReload__BearerTokenSecret: ${CONFIGURATION_RELOAD_BEARER_TOKEN_SECRET:-}
  HostValidation__Enabled: ${HOST_VALIDATION_ENABLED:-true}
  HostValidation__AllowedHosts__0: ${SERVICE_ALLOWED_HOST_0:-localhost}
  HostValidation__AllowedHosts__1: ${SERVICE_ALLOWED_HOST_1:-127.0.0.1}
  HostValidation__AllowedHosts__2: ${SERVICE_ALLOWED_HOST_2:-::1}
  HostValidation__AllowedHosts__3: ${SERVICE_ALLOWED_HOST_3:-host.docker.internal}
  HostValidation__AllowedHosts__4: ${SERVICE_ALLOWED_HOST_4:-cmdbwebhooks2kafka}
  HostValidation__AllowedHosts__5: ${SERVICE_ALLOWED_HOST_5:-cmdbaggregation2cmdbuild}
  HostValidation__AllowedHosts__6: ${SERVICE_ALLOWED_HOST_6:-cmdbconfigbuilder}
  HostValidation__AllowedHosts__7: ${SERVICE_ALLOWED_HOST_7:-zabbixconfig2api}
  HostValidation__AllowedHosts__8: ${SERVICE_ALLOWED_HOST_8:-cmdbmodelmaterializer}
  HostValidation__AllowedHosts__9: ${SERVICE_ALLOWED_HOST_9:-monitoring-ui-api}
  TrustedProxies__Enabled: ${TRUSTED_PROXIES_ENABLED:-true}
  TrustedProxies__Networks__0: ${TRUSTED_PROXY_0:-127.0.0.1}
  TrustedProxies__Networks__1: ${TRUSTED_PROXY_1:-::1}
  RateLimiting__TrustForwardedFor: ${TRUST_FORWARDED_FOR:-true}
  Metrics__RequireBearerToken: ${METRICS_REQUIRE_BEARER_TOKEN:-false}
  Metrics__BearerToken: ${METRICS_BEARER_TOKEN:-}
  Metrics__BearerTokenSecret: ${METRICS_BEARER_TOKEN_SECRET:-}
  Metrics__AllowedNetworks__0: ${METRICS_ALLOWED_NETWORK_0:-}
  SecurityHeaders__HstsEnabled: ${HSTS_ENABLED:-false}

x-extra-hosts: &extra-hosts
  - host.docker.internal:host-gateway

services:
  cmdbwebhooks2kafka:
    build:
      context: .
      dockerfile: src/cmdbwebhooks2kafka/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:5180
    ports:
      - "5180:5180"
    extra_hosts: *extra-hosts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5180/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cmdbaggregation2cmdbuild:
    build:
      context: .
      dockerfile: src/cmdbaggregation2cmdbuild/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:5181
      Cmdbuild__BaseUrl: ${CMDBUILD_BASE_URL:-}
      Cmdbuild__Username: ${CMDBUILD_USERNAME:-}
      Cmdbuild__Password: ${CMDBUILD_PASSWORD:-}
      Cmdbuild__ApiToken: ${CMDBUILD_API_TOKEN:-}
    ports:
      - "5181:5181"
    extra_hosts: *extra-hosts
    volumes:
      - cmdb2m-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5181/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cmdbconfigbuilder:
    build:
      context: .
      dockerfile: src/cmdbconfigbuilder/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:5182
      Cmdbuild__BaseUrl: ${CMDBUILD_BASE_URL:-}
      Cmdbuild__Username: ${CMDBUILD_USERNAME:-}
      Cmdbuild__Password: ${CMDBUILD_PASSWORD:-}
      Cmdbuild__ApiToken: ${CMDBUILD_API_TOKEN:-}
      Zabbix__ApiEndpoint: ${ZABBIX_API_ENDPOINT:-}
      Zabbix__User: ${ZABBIX_USER:-}
      Zabbix__Password: ${ZABBIX_PASSWORD:-}
      Zabbix__ApiToken: ${ZABBIX_API_TOKEN:-}
      ZabbixDirtyScopes__Endpoint: http://zabbixconfig2api:5183/runtime-storage/dirty-scopes
    ports:
      - "5182:5182"
    extra_hosts: *extra-hosts
    depends_on:
      zabbixconfig2api:
        condition: service_started
    volumes:
      - cmdb2m-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5182/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  zabbixconfig2api:
    build:
      context: .
      dockerfile: src/zabbixconfig2api/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:5183
      Zabbix__ApiEndpoint: ${ZABBIX_API_ENDPOINT:-}
      Zabbix__User: ${ZABBIX_USER:-}
      Zabbix__Password: ${ZABBIX_PASSWORD:-}
      Zabbix__ApiToken: ${ZABBIX_API_TOKEN:-}
      Cmdbuild__BaseUrl: ${CMDBUILD_BASE_URL:-}
      Cmdbuild__Username: ${CMDBUILD_USERNAME:-}
      Cmdbuild__Password: ${CMDBUILD_PASSWORD:-}
      Cmdbuild__ApiToken: ${CMDBUILD_API_TOKEN:-}
    ports:
      - "5183:5183"
    extra_hosts: *extra-hosts
    volumes:
      - cmdb2m-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5183/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cmdbmodelmaterializer:
    build:
      context: .
      dockerfile: src/cmdbmodelmaterializer/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:5184
      ConversionConfigStore__BaseUrl: http://monitoring-ui-api:8091
      Materializer__ReloadAppliersOnSave: ${MATERIALIZER_RELOAD_APPLIERS_ON_SAVE:-false}
      Materializer__ReloadTargets__0__Enabled: ${MATERIALIZER_RELOAD_TARGETS_ENABLED:-false}
      Materializer__ReloadTargets__0__Url: http://zabbixconfig2api:5183/configuration/reload
      Materializer__ReloadTargets__0__BearerToken: ${CONFIGURATION_RELOAD_BEARER_TOKEN:-}
      Materializer__ReloadTargets__1__Enabled: ${MATERIALIZER_RELOAD_TARGETS_ENABLED:-false}
      Materializer__ReloadTargets__1__Url: http://cmdbaggregation2cmdbuild:5181/configuration/reload
      Materializer__ReloadTargets__1__BearerToken: ${CONFIGURATION_RELOAD_BEARER_TOKEN:-}
    ports:
      - "5184:5184"
    extra_hosts: *extra-hosts
    depends_on:
      monitoring-ui-api:
        condition: service_started
    volumes:
      - cmdb2m-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5184/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitoring-ui-api:
    build:
      context: .
      dockerfile: src/monitoring-ui-api/Dockerfile
    environment:
      NODE_ENV: Production
      MONITORING_UI_HOST: 0.0.0.0
      MONITORING_UI_PORT: 8091
      MONITORING_UI_WEBHOOKS_BASE_URL: http://cmdbwebhooks2kafka:5180
      MONITORING_UI_CMDBAGGREGATION_BASE_URL: http://cmdbaggregation2cmdbuild:5181
      MONITORING_UI_CMDBCONFIGBUILDER_BASE_URL: http://cmdbconfigbuilder:5182
      MONITORING_UI_ZABBIXCONFIG_BASE_URL: http://zabbixconfig2api:5183
      MONITORING_UI_MATERIALIZER_BASE_URL: http://cmdbmodelmaterializer:5184
      MONITORING_UI_CONVERSION_CONFIG_STORE_BACKEND: ${MONITORING_UI_CONVERSION_CONFIG_STORE_BACKEND:-folder}
      MONITORING_UI_CONVERSION_CONFIG_POSTGRES_CONNECTION_STRING: ${MONITORING_UI_CONVERSION_CONFIG_POSTGRES_CONNECTION_STRING:-}
      MONITORING_UI_HOST_VALIDATION_ENABLED: ${HOST_VALIDATION_ENABLED:-true}
      MONITORING_UI_ALLOWED_HOST_0: ${SERVICE_ALLOWED_HOST_0:-localhost}
      MONITORING_UI_ALLOWED_HOST_1: ${SERVICE_ALLOWED_HOST_1:-127.0.0.1}
      MONITORING_UI_ALLOWED_HOST_2: ${SERVICE_ALLOWED_HOST_2:-::1}
      MONITORING_UI_ALLOWED_HOST_3: ${SERVICE_ALLOWED_HOST_3:-host.docker.internal}
      MONITORING_UI_ALLOWED_HOST_4: ${SERVICE_ALLOWED_HOST_4:-cmdbwebhooks2kafka}
      MONITORING_UI_ALLOWED_HOST_5: ${SERVICE_ALLOWED_HOST_5:-cmdbaggregation2cmdbuild}
      MONITORING_UI_ALLOWED_HOST_6: ${SERVICE_ALLOWED_HOST_6:-cmdbconfigbuilder}
      MONITORING_UI_ALLOWED_HOST_7: ${SERVICE_ALLOWED_HOST_7:-zabbixconfig2api}
      MONITORING_UI_ALLOWED_HOST_8: ${SERVICE_ALLOWED_HOST_8:-cmdbmodelmaterializer}
      MONITORING_UI_ALLOWED_HOST_9: ${SERVICE_ALLOWED_HOST_9:-monitoring-ui-api}
      MONITORING_UI_TRUSTED_PROXIES_ENABLED: ${TRUSTED_PROXIES_ENABLED:-true}
      MONITORING_UI_TRUSTED_PROXY_0: ${TRUSTED_PROXY_0:-127.0.0.1}
      MONITORING_UI_TRUSTED_PROXY_1: ${TRUSTED_PROXY_1:-::1}
      MONITORING_UI_RATE_LIMIT_TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
      MONITORING_UI_METRICS_REQUIRE_BEARER_TOKEN: ${METRICS_REQUIRE_BEARER_TOKEN:-false}
      MONITORING_UI_METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      MONITORING_UI_METRICS_BEARER_TOKEN_SECRET: ${METRICS_BEARER_TOKEN_SECRET:-}
      MONITORING_UI_METRICS_ALLOWED_NETWORK_0: ${METRICS_ALLOWED_NETWORK_0:-}
      MONITORING_UI_HSTS_ENABLED: ${HSTS_ENABLED:-false}
      MONITORING_UI_DEBUG_ENABLED: ${DEBUG_ENABLED:-false}
      MONITORING_UI_DEBUG_LEVEL: ${DEBUG_LEVEL:-Basic}
      MONITORING_UI_LOGGING_ENVIRONMENT: ${LOGGING_ENVIRONMENT:-Production}
      MONITORING_UI_LOGGING_MINIMUM_LEVEL: ${LOGGING_MINIMUM_LEVEL:-Information}
      MONITORING_UI_LOGGING_REQUIRE_EXTERNAL_SINK: ${LOGGING_REQUIRE_EXTERNAL_SINK:-false}
      MONITORING_UI_KAFKA_LOGGING_ENABLED: ${KAFKA_LOGGING_ENABLED:-false}
      MONITORING_UI_KAFKA_LOGGING_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      MONITORING_UI_KAFKA_LOGGING_TOPIC: ${KAFKA_LOGGING_TOPIC:-service-suppression.logs}
      MONITORING_UI_KAFKA_LOGGING_USERNAME: ${KAFKA_USERNAME:-}
      MONITORING_UI_KAFKA_LOGGING_PASSWORD: ${KAFKA_PASSWORD:-}
      MONITORING_UI_KAFKA_LOGGING_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-plain}
      MONITORING_UI_ELK_LOGGING_ENABLED: ${ELK_LOGGING_ENABLED:-false}
      MONITORING_UI_ELK_LOGGING_ENDPOINT: ${ELK_LOGGING_ENDPOINT:-}
      MONITORING_UI_ELK_LOGGING_API_KEY: ${ELK_LOGGING_API_KEY:-}
      MONITORING_UI_ELK_LOGGING_INDEX: ${MONITORING_UI_ELK_LOGGING_INDEX:-monitoring-ui-api-logs}
      MONITORING_UI_READINESS_CHECK_EXTERNAL_DEPENDENCIES: ${READINESS_CHECK_EXTERNAL_DEPENDENCIES:-false}
      MONITORING_UI_READINESS_CHECK_TIMEOUT_MS: ${READINESS_CHECK_TIMEOUT_MS:-2000}
    ports:
      - "8091:8091"
    extra_hosts: *extra-hosts
    volumes:
      - cmdb2m-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  cmdb2m-state:
